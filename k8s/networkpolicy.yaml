# Zero trust networking: everything is blocked unless explicitly allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: secureship
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# The only door in: HTTP on port 8080 (users through the Service + Prometheus scraping).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devboard-allow-http
  namespace: secureship
spec:
  podSelector:
    matchLabels:
      app: devboard
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
---
# The only door out: DNS. Even a compromised pod cannot download tools or leak data.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devboard-allow-dns
  namespace: secureship
spec:
  podSelector:
    matchLabels:
      app: devboard
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
