# Auto-scaling: 2 pods normally, up to 6 when average CPU passes 60% of the request.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devboard
  namespace: secureship
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devboard
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60 # shrink back quickly after the demo load test
