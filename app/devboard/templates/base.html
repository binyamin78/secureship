<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecureShip DevBoard</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
    header { padding:16px 24px; background:var(--card); display:flex; gap:24px; align-items:center; }
    header h1 { margin:0; font-size:20px; color:var(--accent); }
    header a { color:var(--text); text-decoration:none; }
    header .meta { margin-left:auto; color:var(--muted); font-size:13px; }
    main { max-width:760px; margin:24px auto; padding:0 16px; }
    .card { background:var(--card); border-radius:10px; padding:16px; margin-bottom:12px; }
    .muted { color:var(--muted); font-size:13px; }
    input, textarea, button { font:inherit; padding:8px 10px; border-radius:6px; border:1px solid #334155; background:#0b1220; color:var(--text); }
    button { background:var(--accent); color:#0f172a; border:0; cursor:pointer; font-weight:600; }
    form { display:flex; gap:8px; flex-wrap:wrap; }
    textarea { flex:1 1 100%; min-height:60px; }
    pre { white-space:pre-wrap; background:#0b1220; padding:12px; border-radius:6px; }
  </style>
</head>
<body>
  <header>
    <h1>DevBoard</h1>
    <a href="/">Board</a>
    <span class="meta">version {{ version }}{% if pod %} &middot; pod {{ pod }}{% endif %}</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
